name: resolver

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Advance market cycles
        run: node scripts/resolve.mjs

      - name: Commit ledger
        run: |
          git config user.name "cookie-prophet-resolver"
          git config user.email "resolver@users.noreply.github.com"
          git add public/resolutions.json
          git diff --staged --quiet || git commit -m "chore(resolver): cycle update"
          git pull --rebase origin main
          git push
