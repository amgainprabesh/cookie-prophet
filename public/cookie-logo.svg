<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing circuit ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />
  <circle cx="50" cy="50" r="41" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" />
  <!-- Cookie body -->
  <circle cx="50" cy="50" r="36" fill="url(#cookieGrad)" filter="url(#glow)" />
  <!-- Chocolate chips / Circuit nodes -->
  <circle cx="38" cy="36" r="5" fill="#451a03" />
  <circle cx="62" cy="40" r="6" fill="#451a03" />
  <circle cx="48" cy="62" r="5.5" fill="#451a03" />
  <circle cx="35" cy="58" r="4" fill="#451a03" />
  <circle cx="64" cy="60" r="4.5" fill="#451a03" />
  <circle cx="50" cy="46" r="3.5" fill="#78350f" />
  <!-- Cyber accent nodes -->
  <circle cx="38" cy="36" r="2" fill="#38bdf8" />
  <circle cx="62" cy="40" r="2.5" fill="#38bdf8" />
  <circle cx="48" cy="62" r="2" fill="#38bdf8" />
  <!-- Circuit traces connecting chips -->
  <path d="M38 36 L50 46 L62 40 M50 46 L48 62 M35 58 L48 62 L64 60" stroke="#38bdf8" stroke-width="1" opacity="0.7" />
</svg>
